<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mökkikalenteri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar CSS & JS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #app-container, #view-reports-wrapper, #monthly-reports-content, #monthly-reports-content * { visibility: visible; }
            #view-reports-wrapper { position: absolute; left: 0; top: 0; width: 100%; border: none !important; box-shadow: none !important; padding: 0 !important; }
            #report-month-picker, button { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- LOGIN / REGISTER VIEW -->
    <div id="auth-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 overflow-hidden relative">
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-teal-500 to-indigo-600"></div>
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-teal-50 text-teal-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-mountain-sun"></i>
                </div>
                <h1 id="auth-title" class="text-2xl font-bold text-slate-900">Mökkikalenteri</h1>
                <p id="auth-subtitle" class="text-sm text-slate-500 mt-1">Kirjaudu sisään hallitaksesi varauksia</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Sähköpostiosoite</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition" placeholder="esimerkki@email.fi">
                    </div>
                </div>
                <div id="password-field-container">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Salasana</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition" placeholder="••••••••">
                    </div>
                </div>

                <div id="auth-error" class="hidden text-xs text-rose-500 bg-rose-50 border border-rose-100 p-3 rounded-xl font-medium"></div>
                <div id="auth-success" class="hidden text-xs text-teal-600 bg-teal-50 border border-teal-100 p-3 rounded-xl font-medium"></div>

                <button type="submit" id="auth-submit-btn" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-xl shadow-lg transition duration-200">
                    Kirjaudu sisään
                </button>
            </form>

            <div class="mt-6 flex items-center justify-between text-xs">
                <button type="button" id="forgot-password-link" class="text-slate-500 hover:text-teal-600 font-medium transition">Unohditko salasanan?</button>
                <button type="button" id="toggle-auth-mode" class="text-slate-500 hover:text-teal-600 font-medium transition">Eikö tiliä? <span class="text-teal-600 font-bold underline">Rekisteröidy</span></button>
            </div>
        </div>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="app-container" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-teal-600 text-white rounded-xl flex items-center justify-center text-lg shadow-md">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 leading-tight">Mökkikalenteri</h1>
                        <p id="user-role-badge" class="text-xs font-medium text-slate-500">Ladataan...</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="open-modal-btn" class="hidden bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-md transition flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i><span>Lisää uusi varaus</span>
                    </button>
                    <button id="logout-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-4 py-2.5 rounded-xl transition flex items-center space-x-2">
                        <i class="fa-solid fa-right-from-bracket"></i><span>Kirjaudu ulos</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Admin Navigation Tabs -->
        <div id="admin-tabs-container" class="hidden bg-white border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8">
                <button id="tab-calendar" class="py-3 text-sm font-bold text-teal-600 border-b-2 border-teal-600 transition flex items-center space-x-2"><i class="fa-solid fa-calendar"></i><span>Kalenteri</span></button>
                <button id="tab-tasks" class="py-3 text-sm font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent transition flex items-center space-x-2"><i class="fa-solid fa-list-check"></i><span>Päivän tehtävät</span></button>
                <button id="tab-reports" class="py-3 text-sm font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent transition flex items-center space-x-2"><i class="fa-solid fa-chart-pie"></i><span>Kuukausitilastot</span></button>
                <button id="tab-cabins" class="py-3 text-sm font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent transition flex items-center space-x-2"><i class="fa-solid fa-house-chimney"></i><span>Mökkien hallinta</span></button>
            </div>
        </div>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Varaukset & Tilastot</h2>
                    <div class="space-y-4">
                        <div class="p-4 bg-teal-50 border border-teal-100 rounded-xl">
                            <div class="text-xs font-semibold text-teal-600 uppercase">Omia merkintöjä / varauksia</div>
                            <div id="stat-my-events" class="text-2xl font-black text-teal-900 mt-1">0</div>
                        </div>
                        <div id="admin-stat-card" class="hidden p-4 bg-indigo-50 border border-indigo-100 rounded-xl">
                            <div class="text-xs font-semibold text-indigo-600 uppercase">Kaikki varaukset yhteensä</div>
                            <div id="stat-total-events" class="text-2xl font-black text-indigo-900 mt-1">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <!-- Kalenteri -->
                <div id="view-calendar-wrapper" class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
                    <div id="calendar"></div>
                </div>

                <!-- Tehtävät -->
                <div id="view-tasks-wrapper" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-4 border-b border-slate-100">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Päivän siivoukset ja tarkastukset</h2>
                        </div>
                        <div>
                            <input type="date" id="task-date-picker" class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700">
                        </div>
                    </div>
                    <div id="daily-tasks-list" class="space-y-3"></div>
                </div>

                <!-- Kuukausiraportit -->
                <div id="view-reports-wrapper" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-4 border-b border-slate-100">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Kuukausitilastot ja tarkat päivämäärät</h2>
                        </div>
                        <div class="flex items-center space-x-3">
                            <input type="month" id="report-month-picker" class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700">
                            <button type="button" onclick="window.print()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-xl transition flex items-center space-x-2">
                                <i class="fa-solid fa-print"></i><span>Tulosta / PDF</span>
                            </button>
                        </div>
                    </div>
                    <div id="monthly-reports-content" class="space-y-4"></div>
                </div>

                <!-- Mökkien hallinta -->
                <div id="view-cabins-wrapper" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-6">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Mökkien hallinta</h2>
                        </div>
                    </div>
                    <form id="cabin-form" class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mökin nimi</label>
                            <input type="text" id="new-cabin-name" required class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Omistajan sähköposti</label>
                            <input type="email" id="new-cabin-email" required class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm">
                        </div>
                        <div>
                            <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold rounded-xl shadow-md">Lisää mökki</button>
                        </div>
                    </form>
                    <div id="cabins-list" class="space-y-3 pt-2"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- LISÄÄ / MUOKKAA VARAUS MODAL -->
    <div id="event-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-2 bg-teal-600"></div>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-slate-900">Lisää uusi varaus</h2>
                <button type="button" id="close-modal-btn" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="event-form" class="space-y-4">
                <input type="hidden" id="event-id">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mökki</label>
                    <select id="event-cabin" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"></select>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Check-in</label>
                        <input type="date" id="event-check-in-date" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Check-out</label>
                        <input type="date" id="event-check-out-date" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Kategoria</label>
                        <select id="event-category" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            <option value="siivous">Siivous</option>
                            <option value="tarkastus">Tarkastus</option>
                            <option value="varaus" selected>Varaus</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Liinavaatteet (kpl)</label>
                        <input type="number" id="event-linens" min="0" value="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Lisätietoa</label>
                    <textarea id="event-notes" rows="3" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm"></textarea>
                </div>
                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <button type="button" id="delete-event-btn" class="hidden px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-semibold rounded-xl">Poista</button>
                    <div class="flex items-center space-x-3 ml-auto">
                        <button type="button" id="cancel-modal-btn" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">Peruuta</button>
                        <button type="submit" class="px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold rounded-xl shadow-lg">Tallenna</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const SUPABASE_URL = "https://onojghiuzbahaqgpdyfn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_A8y0pkolw0Rrf6tD4TrmEA_lkEpU8uk";
        const ADMIN_EMAIL = "jepa.selin@gmail.com";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let calendar = null;
        let authMode = 'login';
        let allEventsCache = [];
        let allCabinsCache = [];

        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const authForm = document.getElementById('auth-form');
        const authTitle = document.getElementById('auth-title');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const toggleAuthModeBtn = document.getElementById('toggle-auth-mode');
        const authError = document.getElementById('auth-error');
        const authSuccess = document.getElementById('auth-success');
        const logoutBtn = document.getElementById('logout-btn');
        const userRoleBadge = document.getElementById('user-role-badge');
        
        const adminTabsContainer = document.getElementById('admin-tabs-container');
        const tabCalendar = document.getElementById('tab-calendar');
        const tabTasks = document.getElementById('tab-tasks');
        const tabReports = document.getElementById('tab-reports');
        const tabCabins = document.getElementById('tab-cabins');
        
        const viewCalendarWrapper = document.getElementById('view-calendar-wrapper');
        const viewTasksWrapper = document.getElementById('view-tasks-wrapper');
        const viewReportsWrapper = document.getElementById('view-reports-wrapper');
        const viewCabinsWrapper = document.getElementById('view-cabins-wrapper');
        
        const taskDatePicker = document.getElementById('task-date-picker');
        const dailyTasksList = document.getElementById('daily-tasks-list');
        const reportMonthPicker = document.getElementById('report-month-picker');
        const monthlyReportsContent = document.getElementById('monthly-reports-content');
        const cabinsList = document.getElementById('cabins-list');
        const cabinForm = document.getElementById('cabin-form');
        const eventCabinSelect = document.getElementById('event-cabin');

        const eventModal = document.getElementById('event-modal');
        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const deleteEventBtn = document.getElementById('delete-event-btn');
        const eventForm = document.getElementById('event-form');

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showApp();
            } else {
                showAuth();
            }

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (session) {
                    currentUser = session.user;
                    showApp();
                }
            });

            const todayStr = new Date().toISOString().split('T')[0];
            taskDatePicker.value = todayStr;
            taskDatePicker.addEventListener('change', renderDailyTasks);
            reportMonthPicker.value = todayStr.slice(0, 7);
            reportMonthPicker.addEventListener('change', renderMonthlyReports);
        });

        function showAuth() {
            authContainer.classList.remove('hidden');
            appContainer.classList.add('hidden');
        }

        async function showApp() {
            authContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
            
            const isAdmin = currentUser.email === ADMIN_EMAIL;
            userRoleBadge.textContent = isAdmin ? `Ylläpitäjä (${currentUser.email})` : `Omistaja (${currentUser.email})`;
            
            if (isAdmin) {
                document.getElementById('admin-stat-card').classList.remove('hidden');
                adminTabsContainer.classList.remove('hidden');
            }
            openModalBtn.classList.remove('hidden');

            await loadCabins();
            initCalendar();
            await loadEvents();
        }

        const tabs = [
            { btn: tabCalendar, wrapper: viewCalendarWrapper },
            { btn: tabTasks, wrapper: viewTasksWrapper, render: renderDailyTasks },
            { btn: tabReports, wrapper: viewReportsWrapper, render: renderMonthlyReports },
            { btn: tabCabins, wrapper: viewCabinsWrapper, render: renderCabinsList }
        ];

        tabs.forEach(tab => {
            if (!tab.btn) return;
            tab.btn.addEventListener('click', () => {
                tabs.forEach(t => {
                    if (!t.btn) return;
                    t.btn.className = "py-3 text-sm font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent transition flex items-center space-x-2";
                    t.wrapper.classList.add('hidden');
                });
                tab.btn.className = "py-3 text-sm font-bold text-teal-600 border-b-2 border-teal-600 transition flex items-center space-x-2";
                tab.wrapper.classList.remove('hidden');
                if (tab.btn === tabCalendar && calendar) calendar.updateSize();
                if (tab.render) tab.render();
            });
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            authSuccess.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (authMode === 'login') {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    authError.textContent = error.message;
                    authError.classList.remove('hidden');
                }
            } else {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    authError.textContent = error.message;
                    authError.classList.remove('hidden');
                } else {
                    authSuccess.textContent = 'Rekisteröityminen onnistui! Voit nyt kirjautua sisään.';
                    authSuccess.classList.remove('hidden');
                }
            }
        });

        toggleAuthModeBtn.addEventListener('click', () => {
            if (authMode === 'login') {
                authMode = 'register';
                authTitle.textContent = "Luo uusi tili";
                authSubmitBtn.textContent = "Rekisteröidy";
                toggleAuthModeBtn.innerHTML = 'Onko tili? <span class="text-teal-600 font-bold underline">Kirjaudu</span>';
            } else {
                authMode = 'login';
                authTitle.textContent = "Mökkikalenteri";
                authSubmitBtn.textContent = "Kirjaudu sisään";
                toggleAuthModeBtn.innerHTML = 'Eikö tiliä? <span class="text-teal-600 font-bold underline">Rekisteröidy</span>';
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.reload();
        });

        async function loadCabins() {
            const { data } = await supabaseClient.from('cabins').select('*');
            if (data) {
                allCabinsCache = data;
                eventCabinSelect.innerHTML = '';
                data.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name + ' (' + c.owner_email + ')';
                    eventCabinSelect.appendChild(opt);
                });
            }
        }

        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'fi',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listMonth' },
                events: (fetchInfo, successCallback, failureCallback) => {
                    const mapped = allEventsCache.map(ev => {
                        let color = '#0d9488';
                        if (ev.category === 'siivous') color = '#d97706';
                        if (ev.category === 'tarkastus') color = '#4f46e5';

                        return {
                            id: ev.id,
                            title: (ev.cabins ? ev.cabins.name : 'Mökki') + ' - ' + (ev.category.toUpperCase()),
                            start: ev.start_time,
                            end: ev.end_time,
                            backgroundColor: color,
                            borderColor: color,
                            extendedProps: ev
                        };
                    });
                    successCallback(mapped);
                },
                eventClick: (info) => openModalForEdit(info.event.extendedProps)
            });
            calendar.render();
        }

        async function loadEvents() {
            const { data, error } = await supabaseClient.from('events').select('*, cabins(name, owner_email)');
            if (!error && data) {
                allEventsCache = data;
                
                const myEvents = allEventsCache.filter(ev => currentUser && ev.cabins && ev.cabins.owner_email === currentUser.email);
                document.getElementById('stat-my-events').textContent = myEvents.length;
                if (currentUser && currentUser.email === ADMIN_EMAIL) {
                    document.getElementById('stat-total-events').textContent = allEventsCache.length;
                }

                if (calendar) calendar.refetchEvents();
            }
        }

        openModalBtn.addEventListener('click', () => {
            eventForm.reset();
            document.getElementById('event-id').value = '';
            deleteEventBtn.classList.add('hidden');
            eventModal.classList.remove('hidden');
        });

        closeModalBtn.addEventListener('click', () => eventModal.classList.add('hidden'));
        cancelModalBtn.addEventListener('click', () => eventModal.classList.add('hidden'));

        function openModalForEdit(ev) {
            document.getElementById('event-id').value = ev.id;
            eventCabinSelect.value = ev.cabin_id;
            document.getElementById('event-category').value = ev.category;
            document.getElementById('event-linens').value = ev.linens || 0;
            document.getElementById('event-notes').value = ev.notes || '';

            const start = new Date(ev.start_time);
            const end = new Date(ev.end_time);

            document.getElementById('event-check-in-date').value = start.toISOString().split('T')[0];
            document.getElementById('event-check-out-date').value = end.toISOString().split('T')[0];

            deleteEventBtn.classList.remove('hidden');
            eventModal.classList.remove('hidden');
        }

        eventForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('event-id').value;
            const cabin_id = eventCabinSelect.value;
            const category = document.getElementById('event-category').value;
            const linens = parseInt(document.getElementById('event-linens').value) || 0;
            const notes = document.getElementById('event-notes').value;

            const checkInDate = document.getElementById('event-check-in-date').value;
            const checkOutDate = document.getElementById('event-check-out-date').value;

            const start_time = checkInDate + 'T14:00:00Z';
            const end_time = checkOutDate + 'T10:00:00Z';

            const payload = { 
                cabin_id, 
                category, 
                linens, 
                notes, 
                start_time, 
                end_time,
                user_id: currentUser ? currentUser.id : null 
            };

            let error;
            if (id) {
                const res = await supabaseClient.from('events').update(payload).eq('id', id);
                error = res.error;
            } else {
                const res = await supabaseClient.from('events').insert([payload]);
                error = res.error;
            }

            if (error) {
                alert('Virhe tallennettaessa: ' + error.message);
            } else {
                eventModal.classList.add('hidden');
                await loadEvents();
                renderDailyTasks();
                renderMonthlyReports();
            }
        });

        deleteEventBtn.addEventListener('click', async () => {
            const id = document.getElementById('event-id').value;
            if (!id || !confirm('Poista merkintä?')) return;
            const { error } = await supabaseClient.from('events').delete().eq('id', id);
            if (!error) {
                eventModal.classList.add('hidden');
                await loadEvents();
                renderDailyTasks();
                renderMonthlyReports();
            }
        });

        function renderDailyTasks() {
            const dateVal = taskDatePicker.value;
            if (!dateVal) return;
            const dayEvents = allEventsCache.filter(ev => {
                const start = ev.start_time.split('T')[0];
                const end = ev.end_time.split('T')[0];
                return dateVal >= start && dateVal <= end;
            });
            if (dayEvents.length === 0) {
                dailyTasksList.innerHTML = `<p class="text-xs text-slate-400 italic py-4 text-center">Ei varauksia tai tehtäviä valittuna päivänä.</p>`;
                return;
            }
            let html = '';
            dayEvents.forEach(ev => {
                const cabinName = ev.cabins ? ev.cabins.name : 'Mökki';
                html += `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                    <div><strong>${cabinName}</strong> (${ev.category})</div>
                    <div>${ev.linens} liinavaatetta</div>
                </div>`;
            });
            dailyTasksList.innerHTML = html;
        }

        async function renderMonthlyReports() {
            const monthVal = reportMonthPicker.value;
            if (!monthVal) return;
            const [year, month] = monthVal.split('-').map(Number);
            const monthEvents = allEventsCache.filter(ev => {
                const start = new Date(ev.start_time);
                return start.getFullYear() === year && (start.getMonth() + 1) === month;
            });

            const reportByCabin = {};
            allCabinsCache.forEach(c => {
                reportByCabin[c.id] = { name: c.name, events: [], totalLinens: 0 };
            });

            let totalLinensAll = 0;
            monthEvents.forEach(ev => {
                if (reportByCabin[ev.cabin_id]) {
                    reportByCabin[ev.cabin_id].events.push(ev);
                    const l = Number(ev.linens) || 0;
                    reportByCabin[ev.cabin_id].totalLinens += l;
                    totalLinensAll += l;
                }
            });

            let html = `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-teal-50 border border-teal-100 p-4 rounded-xl">
                        <div class="text-xs font-semibold text-teal-600 uppercase">Tapahtumia yhteensä</div>
                        <div class="text-2xl font-black text-teal-900 mt-1">${monthEvents.length}</div>
                    </div>
                    <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl">
                        <div class="text-xs font-semibold text-indigo-600 uppercase">Aktiiviset mökit</div>
                        <div class="text-2xl font-black text-indigo-900 mt-1">${Object.keys(reportByCabin).length}</div>
                    </div>
                    <div class="bg-amber-50 border border-amber-100 p-4 rounded-xl">
                        <div class="text-xs font-semibold text-amber-600 uppercase">Liinavaatteita yhteensä</div>
                        <div class="text-2xl font-black text-amber-900 mt-1">${totalLinensAll} kpl</div>
                    </div>
                </div>
                <div class="space-y-6">
            `;

            for (const cid in reportByCabin) {
                const cd = reportByCabin[cid];
                html += `<div class="bg-slate-50 border border-slate-200 rounded-xl p-5">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-900">${cd.name}</h3>
                        <span class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-semibold">Liinavaatteet: ${cd.totalLinens} kpl</span>
                    </div>`;
                if (cd.events.length === 0) {
                    html += `<p class="text-xs text-slate-400 italic">Ei varauksia tässä kuussa.</p>`;
                } else {
                    cd.events.forEach(ev => {
                        html += `<div class="bg-white p-2 mb-2 rounded border text-xs flex justify-between">
                            <span>${ev.category.toUpperCase()} (${ev.start_time.split('T')[0]} - ${ev.end_time.split('T')[0]})</span>
                            <span>${ev.linens} liinavaatetta</span>
                        </div>`;
                    });
                }
                html += `</div>`;
            }
            monthlyReportsContent.innerHTML = html;
        }

        async function renderCabinsList() {
            let html = '';
            allCabinsCache.forEach(c => {
                html += `<div class="bg-slate-50 p-3 rounded border flex justify-between items-center text-xs">
                    <span>${c.name} (${c.owner_email})</span>
                </div>`;
            });
            cabinsList.innerHTML = html;
        }

        cabinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('new-cabin-name').value;
            const owner_email = document.getElementById('new-cabin-email').value;
            const { error } = await supabaseClient.rpc('add_cabin_by_email', { cabin_name: name, owner_email: owner_email });
            if (error) {
                alert('Virhe: ' + error.message);
            } else {
                cabinForm.reset();
                await loadCabins();
                renderCabinsList();
            }
        });
    </script>
</body>
</html>
