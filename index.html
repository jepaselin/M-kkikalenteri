<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mökkikalenteri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar CSS & JS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- LOGIN VIEW -->
    <div id="auth-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 overflow-hidden relative">
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-teal-500 to-indigo-600"></div>
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-teal-50 text-teal-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-mountain-sun"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Mökkikalenteri</h1>
                <p class="text-sm text-slate-500 mt-1">Kirjaudu sisään hallitaksesi varauksia tai tehtäviä</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Sähköpostiosoite</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="esimerkki@email.fi">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Salasana</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="••••••••">
                </div>
                <div id="auth-error" class="hidden text-xs text-rose-500 bg-rose-50 border border-rose-100 p-3 rounded-xl font-medium"></div>
                <button type="submit" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-xl shadow-lg transition">Kirjaudu sisään</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="app-container" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-teal-600 text-white rounded-xl flex items-center justify-center text-lg shadow-md">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 leading-tight">Mökkikalenteri</h1>
                        <p id="user-role-badge" class="text-xs font-medium text-slate-500">Ladataan...</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="open-modal-btn" class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-md transition flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Lisää varaus / tehtävä</span>
                    </button>
                    <button id="logout-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-4 py-2.5 rounded-xl transition">Kirjaudu ulos</button>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div id="nav-tabs-container" class="bg-white border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8">
                <button id="tab-calendar" class="py-3 text-sm font-bold text-teal-600 border-b-2 border-teal-600 transition">Kalenteri</button>
                <button id="tab-tasks" class="py-3 text-sm font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent transition">Päivän tehtävät</button>
                <button id="tab-reports" class="py-3 text-sm font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent transition">Kuukausitilastot</button>
                <button id="tab-cabins" class="py-3 text-sm font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent transition">Mökkien hallinta</button>
            </div>
        </div>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Tilastot</h2>
                    <div class="p-4 bg-teal-50 border border-teal-100 rounded-xl">
                        <div class="text-xs font-semibold text-teal-600 uppercase">Merkintöjä yhteensä</div>
                        <div id="stat-total-events" class="text-2xl font-black text-teal-900 mt-1">0</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <!-- Calendar View -->
                <div id="view-calendar-wrapper" class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs">
                    <div id="calendar"></div>
                </div>

                <!-- Daily Tasks View -->
                <div id="view-tasks-wrapper" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-6">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                        <h2 class="text-xl font-bold text-slate-900">Päivän siivoukset ja tarkastukset</h2>
                        <input type="date" id="task-date-picker" class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
                    </div>
                    <div id="daily-tasks-list" class="space-y-3"></div>
                </div>

                <!-- Reports View -->
                <div id="view-reports-wrapper" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-6">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                        <h2 class="text-xl font-bold text-slate-900">Kuukausitilastot</h2>
                        <input type="month" id="report-month-picker" class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold">
                    </div>
                    <div id="monthly-reports-content" class="space-y-4"></div>
                </div>

                <!-- Cabins View -->
                <div id="view-cabins-wrapper" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-xs space-y-6">
                    <h2 class="text-xl font-bold text-slate-900">Mökkien hallinta</h2>
                    <form id="cabin-form" class="bg-slate-50 p-4 rounded-xl border grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                        <input type="text" id="new-cabin-name" required placeholder="Mökin nimi" class="px-4 py-2 bg-white border rounded-xl text-sm">
                        <input type="email" id="new-cabin-email" required placeholder="Omistajan sähköposti" class="px-4 py-2 bg-white border rounded-xl text-sm">
                        <button type="submit" class="py-2 bg-teal-600 text-white text-sm font-semibold rounded-xl">Lisää mökki</button>
                    </form>
                    <div id="cabins-list" class="space-y-3"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- EVENT MODAL -->
    <div id="event-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8 relative">
            <h2 class="text-xl font-bold mb-4">Lisää / Muokkaa merkintää</h2>
            <form id="event-form" class="space-y-4">
                <input type="hidden" id="event-id">
                <div>
                    <label class="block text-xs font-semibold uppercase mb-1">Mökki</label>
                    <select id="event-cabin" required class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-sm"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase mb-1">Päivämäärä / Check-out</label>
                        <input type="date" id="event-check-out-date" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase mb-1">Kategoria</label>
                        <select id="event-category" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                            <option value="siivous">Siivous</option>
                            <option value="tarkastus">Tarkastus</option>
                            <option value="varaus">Varaus</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase mb-1">Liinavaatteet (kpl)</label>
                    <input type="number" id="event-linens" min="0" value="0" class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase mb-1">Lisätieto</label>
                    <textarea id="event-notes" rows="2" class="w-full px-4 py-2 bg-slate-50 border rounded-xl text-sm"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">Peruuta</button>
                    <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-xl text-sm">Tallenna</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://onojghiuzbahaqgpdyfn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_A8y0pkolw0Rrf6tD4TrmEA_lkEpU8uk";
        const ADMIN_EMAIL = "jepa.selin@gmail.com";
        const WORKER_EMAILS = ["tyontekija@revonkajo.fi"];

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null, calendar = null, allEventsCache = [], allCabinsCache = [];

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showApp();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
            }

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('task-date-picker').value = today;
            document.getElementById('task-date-picker').addEventListener('change', renderTasks);

            const currentMonth = today.slice(0, 7);
            document.getElementById('report-month-picker').value = currentMonth;
            document.getElementById('report-month-picker').addEventListener('change', renderReports);
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('auth-error').textContent = "Virhe kirjautumisessa: " + error.message;
                document.getElementById('auth-error').classList.remove('hidden');
            } else {
                location.reload();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            location.reload();
        });

        async function showApp() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');

            const isAdmin = currentUser.email === ADMIN_EMAIL;
            const isWorker = WORKER_EMAILS.includes(currentUser.email);

            document.getElementById('user-role-badge').textContent = isAdmin ? "Ylläpitäjä" : isWorker ? "Työntekijä" : "Mökin omistaja";

            await loadCabins();
            await loadEvents();
            initCalendar();

            if (isWorker && !isAdmin) {
                document.getElementById('nav-tabs-container').classList.add('hidden');
                document.getElementById('view-calendar-wrapper').classList.add('hidden');
                document.getElementById('view-tasks-wrapper').classList.remove('hidden');
                renderTasks();
            }
        }

        // Tabs
        const tabs = [
            { btn: document.getElementById('tab-calendar'), wrapper: document.getElementById('view-calendar-wrapper') },
            { btn: document.getElementById('tab-tasks'), wrapper: document.getElementById('view-tasks-wrapper'), render: renderTasks },
            { btn: document.getElementById('tab-reports'), wrapper: document.getElementById('view-reports-wrapper'), render: renderReports },
            { btn: document.getElementById('tab-cabins'), wrapper: document.getElementById('view-cabins-wrapper'), render: renderCabinsList }
        ];

        tabs.forEach(t => {
            if (!t.btn) return;
            t.btn.addEventListener('click', () => {
                tabs.forEach(x => { if(x.btn) { x.btn.className = "py-3 text-sm font-semibold text-slate-500 border-b-2 border-transparent"; x.wrapper.classList.add('hidden'); }});
                t.btn.className = "py-3 text-sm font-bold text-teal-600 border-b-2 border-teal-600";
                t.wrapper.classList.remove('hidden');
                if (t.render) t.render();
            });
        });

        async function loadCabins() {
            const { data } = await supabaseClient.from('cabins').select('*');
            allCabinsCache = data || [];
            const select = document.getElementById('event-cabin');
            select.innerHTML = allCabinsCache.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        }

        async function loadEvents() {
            const { data } = await supabaseClient.from('events').select('*');
            allEventsCache = data || [];
            document.getElementById('stat-total-events').textContent = allEventsCache.length;
            if (calendar) calendar.refetchEvents();
        }

        function initCalendar() {
            if (calendar) return;
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                locale: 'fi',
                events: allEventsCache.map(ev => ({
                    id: ev.id,
                    title: `[${ev.cabin_name}] ${ev.title} (${ev.category})`,
                    start: ev.check_out || ev.date,
                    backgroundColor: ev.completed ? '#94a3b8' : (ev.category === 'siivous' ? '#0d9488' : '#6366f1')
                }))
            });
            calendar.render();
        }

        function renderTasks() {
            const date = document.getElementById('task-date-picker').value;
            const tasks = allEventsCache.filter(ev => (ev.category === 'siivous' || ev.category === 'tarkastus') && (ev.check_out?.startsWith(date) || ev.date === date));
            
            const list = document.getElementById('daily-tasks-list');
            if (tasks.length === 0) {
                list.innerHTML = `<p class="text-sm text-slate-500">Ei siivous- tai tarkastustehtäviä valitulle päivälle.</p>`;
                return;
            }

            list.innerHTML = tasks.map(ev => `
                <div class="p-4 bg-white border ${ev.completed ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200'} rounded-xl flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-0.5 text-xs font-bold uppercase rounded bg-teal-50 text-teal-700">${ev.category}</span>
                            <span class="font-bold text-slate-900">${ev.cabin_name}</span>
                        </div>
                        <div class="text-xs text-slate-500 mt-1">Liinavaatteita: ${ev.linens || 0} kpl | ${ev.notes || 'Ei lisätietoja'}</div>
                    </div>
                    <button onclick="toggleComplete('${ev.id}', ${ev.completed})" class="px-4 py-2.5 ${ev.completed ? 'bg-slate-200 text-slate-700' : 'bg-emerald-600 hover:bg-emerald-700 text-white'} rounded-xl text-sm font-semibold transition shadow-sm">
                        ${ev.completed ? 'Merkitse kesken' : 'Kuittaa mökki OK'}
                    </button>
                </div>
            `).join('');
        }

        window.toggleComplete = async function(id, currentStatus) {
            await supabaseClient.from('events').update({ completed: !currentStatus }).eq('id', id);
            await loadEvents();
            renderTasks();
        }

        function renderReports() {
            const month = document.getElementById('report-month-picker').value;
            const events = allEventsCache.filter(ev => (ev.check_out || ev.date || '').startsWith(month));
            
            const content = document.getElementById('monthly-reports-content');
            if (events.length === 0) {
                content.innerHTML = `<p class="text-sm text-slate-500">Ei tapahtumia valitulla kuukaudella.</p>`;
                return;
            }

            content.innerHTML = `
                <div class="space-y-2">
                    <p class="text-xs font-bold text-slate-400 uppercase">Kuukauden merkinnät yhteensä: ${events.length}</p>
                    ${events.map(ev => `
                        <div class="p-3 bg-slate-50 border rounded-xl text-xs flex justify-between items-center">
                            <div><strong class="text-slate-800">\${ev.cabin_name}</strong> - ${ev.title} (${ev.category})</div>
                            <div class="text-teal-700 font-semibold">\${ev.check_out || ev.date}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function renderCabinsList() {
            const { data } = await supabaseClient.from('cabins').select('*');
            const list = document.getElementById('cabins-list');
            if (!data || data.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500">Ei mökkejä.</p>`;
                return;
            }
            list.innerHTML = data.map(c => `
                <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-sm">
                    <span>${c.name}</span>
                    <span class="text-xs text-slate-400">Omistaja ID: ${c.owner_id}</span>
                </div>
            `).join('');
        }

        document.getElementById('open-modal-btn').addEventListener('click', () => document.getElementById('event-modal').classList.remove('hidden'));
        document.getElementById('cancel-modal-btn').addEventListener('click', () => document.getElementById('event-modal').classList.add('hidden'));

        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cabin = document.getElementById('event-cabin').value;
            const category = document.getElementById('event-category').value;
            const date = document.getElementById('event-check-out-date').value;

            await supabaseClient.from('events').insert([{
                title: category.charAt(0).toUpperCase() + category.slice(1),
                cabin_name: cabin,
                category: category,
                date: date,
                check_out: `${date}T10:00`,
                linens: parseInt(document.getElementById('event-linens').value) || 0,
                notes: document.getElementById('event-notes').value,
                user_id: currentUser.id
            }]);

            document.getElementById('event-modal').classList.add('hidden');
            loadEvents();
        });
    </script>
</body>
</html>
